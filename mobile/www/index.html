<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>자재</title>
    <style>
      html,body{height:100%;margin:0}
      body{display:grid;place-items:center;background:#FAFAF8;color:#16181D;
        font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
      .logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.5rem}
      .mark{display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:.5rem;background:#1A56DB;color:#fff}
      .note{margin-top:1rem;font-size:.8rem;color:#6b7280;max-width:18rem;text-align:center;line-height:1.5}
    </style>
  </head>
  <body>
    <div>
      <div class="logo"><span class="mark">자</span><span>자재</span></div>
      <p class="note">네이티브 셸이 준비되었습니다. <code>CAP_SERVER_URL</code> 환경변수로 호스팅된 자재 웹앱 주소를 설정하면 앱이 해당 주소를 로드합니다.</p>
    </div>
  </body>
</html>
